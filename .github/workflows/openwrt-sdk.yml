name: OpenWrt SDK

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - packaging/openwrt/**
      - scripts/build-openwrt-sdk.sh
      - .github/workflows/openwrt-sdk.yml
  pull_request:
    paths:
      - packaging/openwrt/**
      - scripts/build-openwrt-sdk.sh
      - .github/workflows/openwrt-sdk.yml

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: SDK dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev file wget zstd
      - uses: actions/cache@v4
        with:
          path: .private/openwrt-sdk
          key: openwrt-sdk-25.12.4-x86-64-v1
      - name: Build APK from pinned source
        run: sh scripts/build-openwrt-sdk.sh
        env:
          JOBS: 2
      - uses: actions/upload-artifact@v4
        with:
          name: ruopenray-openwrt-25.12.4-x86-64
          path: dist/openwrt/*
